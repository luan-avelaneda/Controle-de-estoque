<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Eduluo — Controle de Estoque</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f4f2e8;
      color: #202938;
      font-family: Arial, sans-serif;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      overflow: hidden;
      background: #fff;
      border: 1px solid #e3e1d8;
      border-radius: 12px;
      box-shadow: 0 12px 35px rgba(25, 48, 85, 0.12);
    }

    .card-header {
      padding: 28px 32px;
      color: white;
      background: #1554a8;
    }

    .brand {
      font-size: 27px;
      font-weight: 700;
    }

    .subtitle {
      margin-top: 5px;
      color: #dce9fb;
      font-size: 14px;
    }

    .card-content {
      padding: 32px;
    }

    h1 {
      margin-bottom: 8px;
      font-size: 24px;
    }

    .description {
      margin-bottom: 26px;
      color: #687386;
      font-size: 14px;
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      font-size: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid #cfd5df;
      border-radius: 7px;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #1554a8;
      box-shadow: 0 0 0 3px rgba(21, 84, 168, 0.13);
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 13px;
      border: 0;
      border-radius: 7px;
      color: white;
      background: #1554a8;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #104587;
    }

    .message {
      margin-top: 16px;
      padding: 10px;
      border-radius: 6px;
      color: #8c2525;
      background: #fff0f0;
      font-size: 14px;
    }

    .footer {
      padding: 16px;
      border-top: 1px solid #eeece5;
      color: #7a8290;
      text-align: center;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main class="login-card">
    <header class="card-header">
      <div class="brand">Eduluo</div>
      <div class="subtitle">Controle de Estoque</div>
    </header>

    <section class="card-content">
      <h1>Entrar</h1>
      <p class="description">Acesse sua conta para continuar no sistema.</p>

      <form method="POST" action="{{ url_for('login.entrar') }}"
        <label for="usuario">Usuário</label>
        <input
          id="usuario"
          name="usuario"
          type="text"
          placeholder="Digite seu usuário"
          autocomplete="username"
          required
        >

        <label for="senha">Senha</label>
        <input
          id="senha"
          name="senha"
          type="password"
          placeholder="Digite sua senha"
          autocomplete="current-password"
          required
        >

        <button type="submit">Acessar sistema</button>
      </form>

      {% with mensagens = get_flashed_messages() %}
        {% if mensagens %}
          <div class="message">{{ mensagens[0] }}</div>
        {% endif %}
      {% endwith %}
    </section>

    <footer class="footer">
      Eduluo — Controle de Estoque · Projeto Acadêmico
    </footer>
  </main>
</body>
</html>
